{% extends "base.html" %}

{% block contents %}
    <h2>{{ object.judul|capfirst }}</h2>
    <small>
        <i>
            {{ object.updated|date }},
            {{ object.kategori.nama }},
            {{ object.penulis.nama }},
            {{ object.views }} view
        </i>
    </small>
    <p>{{ object.isi|linebreaks }}</p>
    
    <a href="{% url 'blog:artikel' %}">
        <input type="button" value="KEMBALI">
    </a>
    <a href="{% url 'blog:update' object.pk %}">
        <input type="button" value="UBAH">
    </a>
    <a href="{% url 'blog:delete' object.pk %}">
        <input type="button" value="HAPUS">
    </a>
{% endblock %}
